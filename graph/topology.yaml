firewall_rules:
  # Inbound from Internet to DMZ
  - from_segment: internet
    to_segment: dmz
    ports: [80, 443]
    proto: tcp
    action: allow
  - from_segment: internet
    to_segment: dmz
    ports: [25]
    proto: tcp
    action: allow
  - from_segment: internet
    to_segment: dmz
    ports: [53]
    proto: udp
    action: allow

  # DMZ to Internal Segments
  - from_segment: dmz
    to_segment: server_lan
    ports: [445, 3389, 5985, 8080, 22]
    proto: tcp
    action: allow
  - from_segment: dmz
    to_segment: user_lan
    ports: [445, 3389, 5985]
    proto: tcp
    action: allow

  # User LAN to DMZ and Server LAN
  - from_segment: user_lan
    to_segment: dmz
    ports: [80, 443, 53]
    proto: tcp
    action: allow
  - from_segment: user_lan
    to_segment: dmz
    ports: [53]
    proto: udp
    action: allow
  - from_segment: user_lan
    to_segment: server_lan
    ports: [88, 389, 445, 3389, 5985, 8080]
    proto: tcp
    action: allow
  - from_segment: user_lan
    to_segment: server_lan
    ports: [88, 389]
    proto: udp
    action: allow

  # Server LAN to DB LAN
  - from_segment: server_lan
    to_segment: db_lan
    ports: [3306, 5432, 873, 22]
    proto: tcp
    action: allow

  # Outbound to Internet
  - from_segment: db_lan
    to_segment: internet
    ports: [443, 8443]
    proto: tcp
    action: allow
  - from_segment: server_lan
    to_segment: internet
    ports: [443, 8443]
    proto: tcp
    action: allow
  - from_segment: dmz
    to_segment: internet
    ports: [80, 443]
    proto: tcp
    action: allow
  - from_segment: user_lan
    to_segment: internet
    ports: [80, 443]
    proto: tcp
    action: allow

crown_jewels:
  - dc-01
  - db-01

entry_points:
  - web-01
  - mail-01

