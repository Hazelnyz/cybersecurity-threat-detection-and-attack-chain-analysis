# ==============================================================================
# ThreatGraph Enterprise Topology (Simulation)
#
# NOTE: The vulnerability IDs, names, and exploitability scores in this file are
# ANALYST-ASSIGNED, CVSS-inspired values designed exclusively for SIMULATION and
# research benchmarking in an academic graph-based threat detection setting.
# They do NOT represent real-world CVEs or authoritative vulnerability disclosures.
# Services without explicit vulnerabilities assume the baseline EXPLOIT_FLOOR.
# ==============================================================================

